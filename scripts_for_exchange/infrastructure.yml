# =============================================================================
#  Конфигурация инфраструктуры для скрипта Exchange (enable_mailboxes.ps1).
#  ---------------------------------------------------------------------------
#  Это рабочая копия секций ad/exchange/server центрального конфига проекта
#  (config/infrastructure.yml), которую скрипт использует по умолчанию, когда
#  запускается из этого каталога.
#
#  ВНИМАНИЕ: при реальном развёртывании этот файл создаётся автоматически
#  скриптом setup.sh (вопросы -> ответы -> файл). Здесь приведён ШАБЛОН с
#  плейсхолдерами <...>. Замените их своими значениями или запустите setup.sh.
#
#  ВАЖНО: файл содержит УЧЁТНЫЕ ДАННЫЕ (пароль) — защищайте доступ к нему.
# =============================================================================

# --- Active Directory / домен -----------------------------------------------
ad:
  host: "<IP адрес контроллера домена / LDAPS>"
  port: 636                                # LDAPS (зашифрованный LDAP)
  base: "<OU=Users,DC=corp,DC=local>"      # база, где приложение создаёт юзеров
  terminated_ou: "<полный DN OU уволенных сотрудников>"
  domain: "<домен, например corp.local>"   # NetBIOS/UPN домен
  default_password: "<пароль по умолчанию для новых пользователей>"

# --- Microsoft Exchange ------------------------------------------------------
exchange:
  server: "<имя сервера Exchange, например EXCHANGE-01>"
  ip: "<IP сервера Exchange>"
  mailbox_db: "<база данных почтовых ящиков, например DB01>"
  primary_domain: "<primary SMTP-домен>"
  secondary_domain: "<secondary SMTP-домен>"
  excluded_ous:                             # OU, для которых ящики НЕ создаём
    - "<полное имя OU исключения №1>"
    - "<полное имя OU исключения №2>"

# --- Веб-сервер / прод --------------------------------------------------------
server:
  name: "<FQDN/имя веб-сервера>"
  ip: "<IP веб-сервера>"
